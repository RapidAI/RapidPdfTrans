language = "C"
include_guard = "RAPIDPDFTRANS_H"
header = """
#ifdef __cplusplus
extern \"C\" {
#endif
"""
trailer = """
#ifdef __cplusplus
}
#endif
"""
autogen_warning = "/* Generated by cbindgen. Do not edit. */"
line_length = 100
tab_width = 4
style = "both"
usize_is_size_t = true

[parse]
parse_deps = false

[export]
exclude = ["DocumentInner"]
