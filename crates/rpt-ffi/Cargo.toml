[package]
name = "rpt-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "C ABI for RapidPdfTrans"
repository.workspace = true

[lib]
name = "rapidpdftrans"
# The shared library is requested with `cargo rustc -- --crate-type cdylib`
# (see packaging/package_sdk.py). Leaving cdylib out of this list keeps a
# normal workspace build from writing librapidpdftrans.so, which is also the
# filename of the rpt-python extension module.
crate-type = ["staticlib", "rlib"]

[dependencies]
rpt-core = { path = "../rpt-core" }
serde_json.workspace = true

[build-dependencies]
cbindgen.workspace = true
