# C/C++ SDK archives: headers, shared library, static library, CMake, pkg-config.
#
# Matrix
#   linux-x86_64   ubuntu-24.04        x86_64-unknown-linux-gnu
#   linux-i686     ubuntu-24.04        i686-unknown-linux-gnu       (multilib)
#   linux-aarch64  ubuntu-24.04-arm    aarch64-unknown-linux-gnu    (native)
#   linux-armv7    ubuntu-24.04        armv7-unknown-linux-gnueabihf (cross + qemu smoke)
#   macos-x86_64   macos-15-intel      x86_64-apple-darwin
#   macos-arm64    macos-14            aarch64-apple-darwin
#   windows-x64    windows-2025        x86_64-pc-windows-msvc
#   windows-x86    windows-2025        i686-pc-windows-msvc
#   windows-arm64  windows-11-arm      aarch64-pc-windows-msvc      (native)
#
# Not built
#   32-bit macOS (i686-apple-darwin): GitHub has no 32-bit macOS runner, and
#   macOS 10.15 dropped 32-bit processes. macos-13 was retired; Intel is
#   macos-15-intel. Linux musl is a wheel target, not a second SDK: one glibc
#   archive per Linux architecture.
#
# Pull requests and workflow_dispatch upload artifacts. A tag v<Cargo.toml version>
# also uploads the archives to a GitHub Release.

name: C/C++ SDK

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            packages: g++ cmake patchelf
            timeout: 60
            cxx: g++
            cflags: ""
            emulator: ""
            cmake_args: ""
            msvc: ""
          - name: linux-i686
            runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
            packages: g++ cmake patchelf gcc-multilib g++-multilib
            timeout: 90
            cxx: g++
            cflags: "-m32"
            emulator: ""
            cmake_args: ""
            msvc: ""
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            packages: g++ cmake patchelf
            timeout: 60
            cxx: g++
            cflags: ""
            emulator: ""
            cmake_args: ""
            msvc: ""
          - name: linux-armv7
            runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            packages: cmake patchelf gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
            timeout: 120
            cxx: arm-linux-gnueabihf-g++
            cflags: ""
            emulator: "qemu-arm -L /usr/arm-linux-gnueabihf"
            cmake_args: ""
            msvc: ""
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            packages: ""
            timeout: 60
            cxx: ""
            cflags: ""
            emulator: ""
            cmake_args: ""
            msvc: ""
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            packages: ""
            timeout: 60
            cxx: ""
            cflags: ""
            emulator: ""
            cmake_args: ""
            msvc: ""
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            packages: ""
            timeout: 60
            cxx: ""
            cflags: ""
            emulator: ""
            cmake_args: "-A x64"
            msvc: x64
          - name: windows-x86
            runner: windows-2025
            target: i686-pc-windows-msvc
            packages: ""
            timeout: 90
            cxx: ""
            cflags: ""
            emulator: ""
            cmake_args: "-A Win32"
            msvc: x86
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            packages: ""
            timeout: 90
            cxx: ""
            cflags: ""
            emulator: ""
            cmake_args: "-A ARM64"
            msvc: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Prepare MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Package SDK
        run: python packaging/package_sdk.py --target ${{ matrix.target }} --out dist

      - name: Smoke test SDK
        run: python packaging/smoke_sdk.py --dist dist --pdf testdata/hello.pdf --cxx "${{ matrix.cxx }}" --cflags "${{ matrix.cflags }}" --emulator "${{ matrix.emulator }}" --cmake-args "${{ matrix.cmake_args }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          merge-multiple: true
          path: dist
      - name: Upload SDK archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/publish-release.sh dist SHA256SUMS-sdk.txt
