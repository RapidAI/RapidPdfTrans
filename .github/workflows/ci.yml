name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Python headers and Poppler
        run: sudo apt-get update && sudo apt-get install -y python3-dev python3-fonttools python3-pil python3-pip g++ poppler-utils mupdf-tools ghostscript fonts-noto-cjk fonts-liberation fonts-arphic-uming tesseract-ocr tesseract-ocr-chi-sim
      - name: Install pdfium
        run: python3 -m pip install --break-system-packages pypdfium2
      - name: Install pdf.js
        run: npm install --prefix /tmp/rpt-viewers pdfjs-dist@6.4.299 @napi-rs/canvas
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        env:
          RPT_VIEWERS_DIR: /tmp/rpt-viewers
        run: cargo test --workspace
      - name: Release artifacts
        run: |
          # cdylib is not in the package crate-type: rpt-python owns that filename
          # during a workspace build. Ask rustc for it here, then smoke it
          # before the Python module overwrites librapidpdftrans.so.
          cargo rustc -p rpt-ffi --release -- --crate-type cdylib
          so=$(ls -1t target/release/deps/librapidpdftrans-*.so | head -1)
          cp -a "$so" target/release/librapidpdftrans.so
          cargo build -p rpt-cli --release
      - name: C++ static smoke
        run: |
          g++ -std=c++17 -I include -I bindings/cpp bindings/cpp/smoke.cpp \
            target/release/librapidpdftrans.a -ldl -lm -lpthread -lgcc_s \
            -o /tmp/rpt-cpp-smoke
          /tmp/rpt-cpp-smoke testdata/hello.pdf
      - name: C++ shared smoke
        run: |
          g++ -std=c++17 -I include -I bindings/cpp bindings/cpp/smoke.cpp \
            -L target/release -lrapidpdftrans -Wl,-rpath,"$PWD/target/release" \
            -o /tmp/rpt-cpp-shared-smoke
          /tmp/rpt-cpp-shared-smoke testdata/hello.pdf
      - name: Python smoke
        run: |
          cargo build -p rpt-python --release
          cp target/release/librapidpdftrans.so /tmp/rapidpdftrans.so
          PYTHONPATH=/tmp python3 bindings/python/smoke.py testdata/hello.pdf
      - name: Go smoke
        working-directory: bindings/go
        run: go test -count=1 .
      - name: CLI smoke
        run: |
          ./target/release/rpt extract testdata/hello.pdf --json > /tmp/hello.json
          python3 -c 'import json; d=json.load(open("/tmp/hello.json")); assert d["plain_text"]=="Hello"'
      - name: Corpus subset fidelity check
        run: cargo run -p rpt-qa --bin rpt-qa -- --manifest corpus/ci/manifest.json --cache corpus/ci --render-pages 1

  cjk-font-smoke:
    name: CJK font smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fontTools
        shell: bash
        run: python -m pip install fonttools
      - name: Cached Noto subset
        shell: bash
        env:
          RPT_FONT_SMOKE: "1"
        run: |
          set -euo pipefail
          unset RPT_CJK_FONT RPT_CJK_BOLD_FONT RPT_CJK_SANS || true
          python - << 'PY'
          import os, sys
          system = [
              "/usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc",
              "/usr/share/fonts/opentype/noto/NotoSerifCJK-Bold.ttc",
              "/Library/Fonts/NotoSerifCJKsc-Regular.otf",
              "/usr/local/share/fonts/NotoSerifCJKsc-Regular.otf",
          ]
          present = [path for path in system if os.path.isfile(path)]
          if present:
              sys.exit("clean runner already has a Song face: " + ",".join(present))
          PY
          cargo test -p rpt-core --lib font::subset::tests::cached_noto_serves_a_clean_machine -- --exact
      - name: Replay translation
        shell: bash
        env:
          RPT_FONT_SMOKE: "1"
        run: |
          set -euo pipefail
          unset RPT_CJK_FONT RPT_CJK_BOLD_FONT RPT_CJK_SANS RPT_LLM_API_KEY RPT_TRANSLATOR || true
          cargo build -p rpt-cli --release
          bin="target/release/rpt"
          if [ -f target/release/rpt.exe ]; then bin="target/release/rpt.exe"; fi
          python - << 'PY'
          import json, pathlib
          # A one-page PDF whose only line is long enough to be rewritten.
          text = b"BT /F1 18 Tf 72 700 Td (Hello world this line is long enough for the font smoke.) Tj ET"
          stream = b"<< /Length %d >>\nstream\n" % len(text) + text + b"\nendstream"
          objects = []
          def obj(n, body):
              objects.append(b"%d 0 obj\n" % n + body + b"\nendobj\n")
          obj(1, b"<< /Type /Catalog /Pages 2 0 R >>")
          obj(2, b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>")
          obj(3, b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>")
          obj(4, stream)
          obj(5, b"<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman >>")
          body = b"%PDF-1.4\n" + b"".join(objects)
          xref = len(body)
          # rebuild with real offsets
          parts = [b"%PDF-1.4\n"]
          offsets = [0]
          for item in objects:
              offsets.append(sum(len(part) for part in parts))
              parts.append(item)
          startxref = sum(len(part) for part in parts)
          xref_table = [b"xref\n0 6\n", b"0000000000 65535 f \n"]
          for offset in offsets[1:]:
              xref_table.append(b"%010d 00000 n \n" % offset)
          parts.extend(xref_table)
          parts.append(b"trailer << /Size 6 /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n" % startxref)
          pathlib.Path("smoke-in.pdf").write_bytes(b"".join(parts))
          pathlib.Path("smoke-replay.json").write_text(json.dumps([
              {"id": 0, "page_index": 0, "glyph_ids": [], "source": "Hello world this line is long enough for the font smoke.", "translated": "\u6df1\u5ea6\u53cc\u5411 Transformer aeo0"}
          ]), encoding="utf-8")
          PY
          "$bin" translate smoke-in.pdf --output smoke-out.pdf --replay smoke-replay.json --json > smoke-out.json
          python - << 'PY'
          import json, pathlib
          from fontTools.ttLib import TTFont
          from io import BytesIO
          report = json.loads(pathlib.Path("smoke-out.json").read_text(encoding="utf-8"))
          texts = " ".join(item.get("translated", "") for item in report.get("translations", []))
          assert "Transformer" in texts and "aeo0" in texts, texts
          data = pathlib.Path("smoke-out.pdf").read_bytes()
          assert b"RPTCJK" in data, "no embedded CJK face"
          # The smoke only proves the translate path embedded a face. Glyph
          # limits are covered by the library tests on the Linux CI job.
          print("smoke ok", len(data))
          PY
