[workspace]
resolver = "2"
members = [
    "crates/rpt-core",
    "crates/rpt-ffi",
    "crates/rpt-cli",
    "crates/rpt-python",
    "crates/rpt-qa",
]
default-members = ["crates/rpt-core", "crates/rpt-ffi", "crates/rpt-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RapidAI"]
repository = "https://github.com/RapidAI/RapidPdfTrans"

[workspace.dependencies]
lopdf = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
encoding_rs = "0.8"
ureq = { version = "3", features = ["json"] }
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
cbindgen = "0.29"
